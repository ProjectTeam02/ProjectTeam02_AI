# 로컬 개발용 AI 서버와 PostgreSQL/pgvector 데이터베이스를 함께 실행합니다.
services:
  ai:
    # FastAPI AI 서버 컨테이너입니다.
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/leren
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    # 벡터 검색을 지원하는 PostgreSQL 이미지입니다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leren
    ports:
      - "5433:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leren"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai_postgres_data:
