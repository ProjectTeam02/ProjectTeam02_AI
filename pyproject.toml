# Python 프로젝트 기본 메타데이터와 테스트·정적 검사 설정입니다.
[project]
name = "leren-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
# 테스트에서 프로젝트 루트를 import 기준으로 사용합니다.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# 모든 Python 파일에 동일한 포맷과 검사 기준을 적용합니다.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
